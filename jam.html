<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Retrofy Jam</title>
<style>
  :root { --bg: #0a1424; --lcd: #9fd4ff; --dim: #3d6a95; --panel: #10203a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--lcd);
         font: 16px/1.5 "Courier New", monospace; padding: 16px; }
  main { width: 100%; max-width: 420px; background: var(--panel); border: 3px solid var(--dim); padding: 24px;
         background-image: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.18) 2px 3px); }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 2px; }
  p { margin: 0 0 18px; color: #c9e6ff; }
  a.btn { display: block; text-align: center; padding: 12px; margin-top: 10px; border: 2px solid var(--lcd);
          color: var(--bg); background: var(--lcd); text-decoration: none; font-weight: bold; letter-spacing: 1px; }
  a.btn.alt { background: transparent; color: var(--lcd); border-color: var(--dim); }
  .bad { color: #ff9fc8; }
</style>
</head>
<body>
<main>
  <h1>RETROFY JAM</h1>
  <p id="msg">Retrofy açılıyor, Jam'e kendisi katılacak.</p>
  <a class="btn" id="retrofy" href="#">RETROFY'DE KATIL</a>
  <a class="btn alt" id="spotify" href="#">RETROFY'M YOK: SPOTIFY'DA KATIL</a>
</main>
<script>
  // Only Spotify Jam invites; anything else is ignored.
  var link = new URLSearchParams(location.search).get("j") || "";
  var ok = /^https:\/\/(open\.spotify\.com\/socialsession\/|spotify\.link\/|spotify\.app\.link\/)[\w\-\/?=&.%]+$/.test(link);
  if (!ok) {
    document.getElementById("msg").textContent = "Bu bağlantıda bir Jam daveti yok.";
    document.getElementById("msg").className = "bad";
    document.getElementById("retrofy").remove();
    document.getElementById("spotify").remove();
  } else {
    var app = "retrofy://jam/?link=" + encodeURIComponent(link);
    document.getElementById("retrofy").href = app;
    document.getElementById("spotify").href = link;
    location.href = app;
  }
</script>
</body>
</html>
